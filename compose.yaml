services:
  postgres:
    image: postgres:18.4-alpine
    container_name: muyun-spring-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: muyun_dev
      POSTGRES_DB: muyun_spring
    ports:
      - "54321:5432"
    volumes:
      - muyun-spring-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d muyun_spring"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  muyun-spring-postgres-data:
