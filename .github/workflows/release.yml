name: Release to Maven Central

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
      SIGNING_SECRET_KEY_BASE64: ${{ secrets.SIGNING_SECRET_KEY_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release tag and credentials
        run: ./gradlew verifyReleaseTagVersion verifyReleaseCredentials

      - name: Verify backend
        run: ./gradlew verifyAll

      - name: Verify published artifact consumer
        run: ./gradlew verifyPublishedConsumer

      - name: Clean release workspace
        run: ./gradlew clean

      - name: Publish to Maven Central
        run: ./gradlew publishReleaseToSonatype
